# Builds the game for Windows, macOS, Linux and Android and publishes a GitHub Release.
# Run it by pushing a version tag:  git tag v0.1.0 && git push origin v0.1.0
name: Release builds

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach the Android build to (desktop builds are skipped)
        required: true

permissions:
  contents: write

jobs:
  desktop:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-22.04
            args: ''
          - platform: windows-latest
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Greenlit ${{ github.ref_name }}
          releaseBody: |
            Free movie studio sim. Play in the browser at https://tagban.github.io/Greenlit/ or download a build below.

            - **Windows:** run the `.msi` or `-setup.exe`. Windows may warn about an unrecognized app; choose More info, then Run anyway.
            - **macOS:** open the `.dmg` and drag Greenlit to Applications. The first time, right-click the app and choose Open (the build isn't notarized yet).
            - **Linux:** the `.AppImage` runs anywhere (mark it executable); `.deb` installs on Debian and Ubuntu.
            - **Android:** install `greenlit-android.apk` (allow installs from your browser or file manager). Test builds use a temporary signing key: uninstall the previous version before installing a new one.

            Found a bug? Use **Report a bug** in the game's Office screen.
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  android:
    needs: desktop
    if: always() && (needs.desktop.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # GitHub's Ubuntu runners come with the Android SDK and NDK already installed.
      - name: Build the APK
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          npx tauri android init --ci
          npx tauri android build --apk --target aarch64 --target armv7
      # Test builds are signed with a throwaway key made here, so they install but each new
      # release must replace the old install. Store releases will need a permanent key.
      - name: Sign the APK for testing
        run: |
          tools=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(find src-tauri/gen/android -name '*release-unsigned.apk' | head -1)
          keytool -genkeypair -keystore test.jks -storepass greenlit -keypass greenlit -alias greenlit \
            -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=Greenlit test build"
          "$tools/zipalign" -f 4 "$unsigned" aligned.apk
          "$tools/apksigner" sign --ks test.jks --ks-pass pass:greenlit --out greenlit-android.apk aligned.apk
          ls -la greenlit-android.apk
      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$RELEASE_TAG" greenlit-android.apk --clobber
