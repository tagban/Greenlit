<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03030c"/>
      <stop offset="0.5" stop-color="#0d0b2a"/>
      <stop offset="0.75" stop-color="#2a1a4a"/>
    </linearGradient>
    <radialGradient id="planet" cx="0.35" cy="0.3" r="0.75">
      <stop offset="0" stop-color="#ffd9a8"/>
      <stop offset="0.35" stop-color="#e88a5a"/>
      <stop offset="0.7" stop-color="#7a3a6a"/>
      <stop offset="1" stop-color="#1e1036"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c9b6ff" stop-opacity="0.1"/>
      <stop offset="0.3" stop-color="#f3d9c0" stop-opacity="0.85"/>
      <stop offset="0.7" stop-color="#f3d9c0" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#c9b6ff" stop-opacity="0.1"/>
    </linearGradient>
    <radialGradient id="atmo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.8" stop-color="#ff9a6a" stop-opacity="0"/>
      <stop offset="0.9" stop-color="#ffb08a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ff9a6a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ridge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#140c22"/>
      <stop offset="1" stop-color="#040308"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#030208" stop-opacity="0"/>
      <stop offset="1" stop-color="#030208" stop-opacity="0.95"/>
    </linearGradient>
    <clipPath id="front"><rect x="0" y="560" width="1024" height="400"/></clipPath>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1024" height="1536" fill="url(#space)"/>
  <!-- nebula wash -->
  <ellipse cx="200" cy="260" rx="300" ry="140" fill="#3a2a8a" opacity="0.35" filter="url(#blur)"/>
  <ellipse cx="860" cy="900" rx="260" ry="120" fill="#8a2a6a" opacity="0.3" filter="url(#blur)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="60" cy="80" r="2"/><circle cx="150" cy="40" r="1.2"/><circle cx="240" cy="120" r="1.6"/>
    <circle cx="330" cy="60" r="1"/><circle cx="420" cy="140" r="2.2"/><circle cx="510" cy="50" r="1.3"/>
    <circle cx="610" cy="100" r="1.8"/><circle cx="720" cy="30" r="1.1"/><circle cx="820" cy="90" r="2"/>
    <circle cx="930" cy="50" r="1.4"/><circle cx="990" cy="160" r="1.2"/><circle cx="90" cy="210" r="1.3"/>
    <circle cx="180" cy="330" r="1.8"/><circle cx="40" cy="420" r="1.1"/><circle cx="120" cy="520" r="2"/>
    <circle cx="60" cy="640" r="1.3"/><circle cx="160" cy="760" r="1.6"/><circle cx="40" cy="880" r="1.2"/>
    <circle cx="960" cy="300" r="1.7"/><circle cx="990" cy="460" r="1.2"/><circle cx="940" cy="600" r="2"/>
    <circle cx="990" cy="720" r="1.1"/><circle cx="900" cy="830" r="1.5"/><circle cx="380" cy="240" r="1"/>
    <circle cx="700" cy="200" r="1.3"/><circle cx="560" cy="180" r="1"/><circle cx="270" cy="200" r="1.1"/>
    <circle cx="850" cy="210" r="1"/><circle cx="460" cy="220" r="1.4"/><circle cx="20" cy="300" r="1"/>
  </g>
  <g fill="#cfe0ff">
    <circle cx="300" cy="170" r="3"/><circle cx="880" cy="140" r="3.2"/><circle cx="100" cy="600" r="2.6"/>
  </g>

  <!-- ring back half (behind planet) -->
  <ellipse cx="560" cy="620" rx="520" ry="110" fill="none" stroke="url(#ring)" stroke-width="26" transform="rotate(-14 560 620)" opacity="0.6"/>
  <!-- planet -->
  <circle cx="560" cy="620" r="320" fill="url(#planet)"/>
  <circle cx="560" cy="620" r="350" fill="url(#atmo)"/>
  <!-- bands -->
  <g fill="none" stroke="#5a2a5a" stroke-width="10" opacity="0.25">
    <path d="M250 560 Q560 520 870 600"/><path d="M262 680 Q560 640 860 720"/><path d="M300 790 Q560 760 820 830"/>
  </g>
  <!-- ring front half (lower arc over planet) -->
  <g clip-path="url(#front)">
    <ellipse cx="560" cy="620" rx="520" ry="110" fill="none" stroke="url(#ring)" stroke-width="26" transform="rotate(-14 560 620)"/>
    <ellipse cx="560" cy="620" rx="470" ry="92" fill="none" stroke="#f3d9c0" stroke-width="6" opacity="0.5" transform="rotate(-14 560 620)"/>
  </g>

  <!-- small moon -->
  <circle cx="180" cy="420" r="34" fill="#9a8ac0"/>
  <circle cx="192" cy="412" r="30" fill="#0d0b2a" opacity="0.6"/>

  <!-- far ridges -->
  <path d="M0 1080 L120 1010 L230 1050 L360 960 L470 1020 L600 980 L740 1040 L860 970 L1024 1030 L1024 1536 L0 1536 Z" fill="#24163a"/>
  <!-- near ridge with figure on peak -->
  <path d="M0 1200 L180 1150 L330 1110 L470 1030 L520 1020 L600 1060 L760 1120 L900 1150 L1024 1170 L1024 1536 L0 1536 Z" fill="url(#ridge)"/>
  <!-- rim light on ridge -->
  <path d="M330 1110 L470 1030 L520 1020 L600 1060" fill="none" stroke="#ff9a7a" stroke-width="3" opacity="0.6"/>

  <!-- lone figure, looking up -->
  <g fill="#040308">
    <ellipse cx="500" cy="918" rx="15" ry="17"/>
    <path d="M488 934 L514 934 L526 950 L530 1000 L520 1002 L518 970 L516 1022 L508 1022 L503 990 L499 1022 L491 1022 L488 970 L484 1002 L476 1000 L478 950 Z"/>
    <!-- cape -->
    <path d="M488 940 L470 1020 L494 1006 Z"/>
  </g>
  <path d="M488 905 Q500 896 512 905" fill="none" stroke="#ffb08a" stroke-width="2" opacity="0.8"/>

  <rect y="1050" width="1024" height="486" fill="url(#fade)"/>
</svg>
