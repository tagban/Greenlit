<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b1030"/>
      <stop offset="1" stop-color="#6a1f2a"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8e1424"/>
      <stop offset="0.25" stop-color="#d23a3a"/>
      <stop offset="0.5" stop-color="#9c1828"/>
      <stop offset="0.75" stop-color="#d84040"/>
      <stop offset="1" stop-color="#8e1424"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff4c2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffd86b" stop-opacity="0.25"/>
    </linearGradient>
    <radialGradient id="pool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff2b8"/>
      <stop offset="0.6" stop-color="#ffcf5a" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#ffb02e" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8692e"/>
      <stop offset="1" stop-color="#3a1a0e"/>
    </linearGradient>
    <linearGradient id="peel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff07a"/>
      <stop offset="1" stop-color="#f2b400"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#14060a" stop-opacity="0"/>
      <stop offset="1" stop-color="#14060a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1024" height="1536" fill="url(#back)"/>
  <!-- back curtain folds -->
  <g fill="#4a1226" opacity="0.6">
    <rect x="260" y="0" width="40" height="980"/><rect x="380" y="0" width="40" height="980"/>
    <rect x="500" y="0" width="40" height="980"/><rect x="620" y="0" width="40" height="980"/>
    <rect x="740" y="0" width="40" height="980"/>
  </g>

  <!-- stage floor -->
  <path d="M0 980 L1024 980 L1024 1536 L0 1536 Z" fill="url(#floor)"/>
  <g stroke="#5a2a14" stroke-width="3" opacity="0.5">
    <path d="M0 1040 L1024 1040"/><path d="M0 1120 L1024 1120"/><path d="M0 1230 L1024 1230"/>
  </g>
  <rect y="975" width="1024" height="10" fill="#e0a050"/>

  <!-- spotlight beam -->
  <path d="M470 0 L554 0 L760 1080 L264 1080 Z" fill="url(#beam)" opacity="0.55"/>
  <ellipse cx="512" cy="1060" rx="270" ry="70" fill="url(#pool)" filter="url(#blur)"/>

  <!-- banana peel -->
  <g transform="translate(512 1040) scale(1.7)">
    <ellipse cx="0" cy="18" rx="110" ry="14" fill="#3a1a0e" opacity="0.5"/>
    <!-- left flap -->
    <path d="M-10 -10 Q-70 -20 -110 10 Q-80 0 -40 6 Z" fill="url(#peel)" stroke="#a46c00" stroke-width="3"/>
    <!-- right flap -->
    <path d="M10 -10 Q70 -24 108 12 Q76 0 38 6 Z" fill="url(#peel)" stroke="#a46c00" stroke-width="3"/>
    <!-- front flap -->
    <path d="M-12 -4 Q-30 10 -24 22 Q0 26 26 20 Q28 8 12 -4 Z" fill="#ffe25a" stroke="#a46c00" stroke-width="3"/>
    <!-- center stub -->
    <path d="M-16 -8 Q-14 -60 0 -78 Q14 -60 16 -8 Z" fill="url(#peel)" stroke="#a46c00" stroke-width="3"/>
    <path d="M-4 -74 L0 -92 L6 -74 Z" fill="#5a3a10"/>
    <path d="M-30 4 Q-50 -2 -80 6" stroke="#d99a00" stroke-width="2" fill="none"/>
    <path d="M30 4 Q50 -4 80 6" stroke="#d99a00" stroke-width="2" fill="none"/>
  </g>

  <!-- main curtains -->
  <path d="M0 0 L250 0 Q230 400 170 700 Q140 860 220 1000 L0 1000 Z" fill="url(#curtain)"/>
  <path d="M1024 0 L774 0 Q794 400 854 700 Q884 860 804 1000 L1024 1000 Z" fill="url(#curtain)"/>
  <g fill="none" stroke="#6a0e1a" stroke-width="5" opacity="0.6">
    <path d="M80 0 Q70 500 60 1000"/><path d="M160 0 Q140 500 110 980"/>
    <path d="M944 0 Q954 500 964 1000"/><path d="M864 0 Q884 500 914 980"/>
  </g>
  <!-- tiebacks -->
  <rect x="150" y="690" width="70" height="18" rx="9" fill="#f2c14e"/>
  <rect x="804" y="690" width="70" height="18" rx="9" fill="#f2c14e"/>

  <!-- valance -->
  <path d="M0 0 L1024 0 L1024 140 Q960 190 896 140 Q832 190 768 140 Q704 190 640 140 Q576 190 512 140 Q448 190 384 140 Q320 190 256 140 Q192 190 128 140 Q64 190 0 140 Z" fill="#b8202e"/>
  <path d="M0 140 Q64 190 128 140 Q192 190 256 140 Q320 190 384 140 Q448 190 512 140 Q576 190 640 140 Q704 190 768 140 Q832 190 896 140 Q960 190 1024 140" fill="none" stroke="#f2c14e" stroke-width="8"/>

  <!-- footlight bulbs -->
  <g fill="#ffe08a">
    <circle cx="80" cy="985" r="7"/><circle cx="200" cy="985" r="7"/><circle cx="320" cy="985" r="7"/>
    <circle cx="440" cy="985" r="7"/><circle cx="584" cy="985" r="7"/><circle cx="704" cy="985" r="7"/>
    <circle cx="824" cy="985" r="7"/><circle cx="944" cy="985" r="7"/>
  </g>

  <!-- confetti -->
  <g opacity="0.85">
    <rect x="330" y="300" width="10" height="18" fill="#5ad1c4" transform="rotate(25 335 309)"/>
    <rect x="690" y="260" width="10" height="18" fill="#ffd34e" transform="rotate(-30 695 269)"/>
    <rect x="420" y="520" width="9" height="16" fill="#ff7aa8" transform="rotate(50 424 528)"/>
    <rect x="620" y="460" width="9" height="16" fill="#8ad35a" transform="rotate(-15 624 468)"/>
    <rect x="560" y="330" width="9" height="16" fill="#ff9a3c" transform="rotate(70 564 338)"/>
    <rect x="370" y="700" width="9" height="16" fill="#ffd34e" transform="rotate(-50 374 708)"/>
    <rect x="660" y="680" width="9" height="16" fill="#5ad1c4" transform="rotate(35 664 688)"/>
  </g>

  <rect y="1100" width="1024" height="436" fill="url(#fade)"/>
</svg>
