<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a2416"/>
      <stop offset="0.6" stop-color="#1e140e"/>
      <stop offset="1" stop-color="#0c0806"/>
    </linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1a33"/>
      <stop offset="0.6" stop-color="#16345c"/>
      <stop offset="1" stop-color="#1f4a78"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd48a" stop-opacity="0.9"/>
      <stop offset="0.4" stop-color="#e8913c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#e8913c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6c47a"/>
      <stop offset="1" stop-color="#c47a32"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070507" stop-opacity="0"/>
      <stop offset="1" stop-color="#070507" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="big" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="20"/></filter>
    <clipPath id="win"><rect x="300" y="180" width="560" height="860"/></clipPath>
  </defs>

  <rect width="1024" height="1536" fill="url(#room)"/>

  <!-- window: night outside -->
  <g clip-path="url(#win)">
    <rect x="300" y="180" width="560" height="860" fill="url(#night)"/>
    <!-- distant city lights, blurred bokeh -->
    <g filter="url(#blur)" opacity="0.8">
      <circle cx="360" cy="860" r="14" fill="#7fb4e8"/>
      <circle cx="430" cy="900" r="10" fill="#c9e2ff"/>
      <circle cx="520" cy="840" r="18" fill="#5f8fc8"/>
      <circle cx="610" cy="910" r="12" fill="#e8c27a"/>
      <circle cx="700" cy="870" r="16" fill="#7fb4e8"/>
      <circle cx="790" cy="920" r="11" fill="#c9e2ff"/>
      <circle cx="830" cy="820" r="9" fill="#5f8fc8"/>
    </g>
    <!-- distant buildings -->
    <path fill="#0b1a2e" d="M300 1040 L300 900 L360 900 L360 940 L420 940 L420 880 L470 880 L470 960 L560 960 L560 920 L640 920 L640 980 L720 980 L720 900 L800 900 L800 950 L860 950 L860 1040 Z"/>
    <!-- rain streaks -->
    <g stroke="#a9cdf2" stroke-width="2" stroke-linecap="round" opacity="0.45">
      <path d="M330 220 L322 300"/><path d="M380 340 L372 430"/><path d="M420 200 L413 270"/>
      <path d="M470 460 L462 560"/><path d="M520 260 L513 330"/><path d="M560 560 L551 650"/>
      <path d="M610 330 L602 420"/><path d="M660 210 L653 280"/><path d="M700 470 L691 560"/>
      <path d="M740 300 L732 380"/><path d="M790 560 L781 650"/><path d="M830 240 L822 320"/>
      <path d="M350 600 L342 690"/><path d="M640 700 L632 780"/><path d="M820 700 L812 780"/>
      <path d="M450 720 L443 790"/><path d="M560 400 L553 470"/><path d="M760 650 L753 720"/>
    </g>
    <!-- droplets on glass -->
    <g fill="#cfe3ff" opacity="0.55">
      <circle cx="350" cy="260" r="5"/><circle cx="452" cy="390" r="4"/><circle cx="540" cy="300" r="6"/>
      <circle cx="680" cy="520" r="5"/><circle cx="770" cy="400" r="4"/><circle cx="600" cy="620" r="5"/>
      <circle cx="820" cy="560" r="6"/><circle cx="400" cy="500" r="4"/>
    </g>
    <!-- figure reflection hint (warm) -->
    <ellipse cx="520" cy="700" rx="180" ry="300" fill="#e8913c" opacity="0.08" filter="url(#big)"/>
  </g>

  <!-- window frame -->
  <g fill="none" stroke="#120c08" stroke-width="22">
    <rect x="300" y="180" width="560" height="860"/>
    <path d="M580 180 L580 1040 M300 600 L860 600"/>
  </g>
  <rect x="270" y="1040" width="620" height="30" fill="#2a1a10"/>
  <rect x="270" y="1040" width="620" height="4" fill="#d89a52" opacity="0.6"/>

  <!-- lamp glow -->
  <circle cx="140" cy="760" r="420" fill="url(#lamp)"/>
  <!-- lamp -->
  <rect x="134" y="800" width="12" height="300" fill="#140d08"/>
  <path d="M60 680 L220 680 L190 800 L90 800 Z" fill="url(#shade)"/>
  <ellipse cx="140" cy="800" rx="50" ry="10" fill="#fff0c8" opacity="0.9"/>

  <!-- figure silhouette at window, back to viewer -->
  <g fill="#0a0705">
    <ellipse cx="560" cy="640" rx="54" ry="66"/>
    <path d="M540 700 L582 700 L588 728 Q680 742 708 800 L740 1000 L720 1180 L400 1180 L384 1000 L414 800 Q440 742 532 728 Z"/>
  </g>
  <!-- warm rim light on figure's left side -->
  <g fill="none" stroke="#f0b062" stroke-linecap="round" opacity="0.75">
    <path d="M508 612 Q506 650 520 690" stroke-width="4"/>
    <path d="M414 802 Q400 880 388 1000" stroke-width="5"/>
    <path d="M440 752 Q420 770 414 800" stroke-width="4"/>
  </g>

  <!-- floor -->
  <rect y="1180" width="1024" height="356" fill="#0a0705"/>
  <rect y="1000" width="1024" height="536" fill="url(#fade)"/>
</svg>
