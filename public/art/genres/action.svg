<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a36"/>
      <stop offset="0.35" stop-color="#1d5563"/>
      <stop offset="0.55" stop-color="#c8662a"/>
      <stop offset="0.68" stop-color="#f2a04a"/>
    </linearGradient>
    <radialGradient id="blast" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6d0"/>
      <stop offset="0.25" stop-color="#ffd166"/>
      <stop offset="0.55" stop-color="#ff7a1a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff4d00" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ff6a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1410"/>
      <stop offset="1" stop-color="#050506"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05080a" stop-opacity="0"/>
      <stop offset="1" stop-color="#05080a" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="5"/></filter>
  </defs>

  <rect width="1024" height="1536" fill="url(#sky)"/>
  <!-- distant smoke clouds -->
  <g fill="#0d2830" opacity="0.55" filter="url(#soft)">
    <ellipse cx="180" cy="300" rx="260" ry="40"/>
    <ellipse cx="860" cy="230" rx="240" ry="34"/>
    <ellipse cx="700" cy="420" rx="200" ry="26"/>
  </g>

  <!-- explosion glow -->
  <circle cx="512" cy="820" r="520" fill="url(#halo)"/>
  <!-- smoke column -->
  <g fill="#2a1a14" opacity="0.85" filter="url(#soft)">
    <circle cx="440" cy="520" r="110"/>
    <circle cx="580" cy="470" r="130"/>
    <circle cx="500" cy="400" r="120"/>
    <circle cx="640" cy="580" r="100"/>
    <circle cx="380" cy="620" r="90"/>
    <circle cx="560" cy="330" r="90"/>
  </g>
  <!-- fireball -->
  <g filter="url(#blur)">
    <circle cx="512" cy="760" r="250" fill="url(#blast)"/>
    <circle cx="410" cy="700" r="140" fill="url(#blast)"/>
    <circle cx="620" cy="690" r="150" fill="url(#blast)"/>
    <circle cx="520" cy="620" r="130" fill="url(#blast)"/>
  </g>
  <circle cx="512" cy="780" r="120" fill="#fff3c4" opacity="0.7" filter="url(#blur)"/>

  <!-- debris sparks -->
  <g fill="#ffd27a">
    <circle cx="300" cy="560" r="4"/><circle cx="720" cy="520" r="5"/>
    <circle cx="250" cy="700" r="3"/><circle cx="790" cy="640" r="4"/>
    <circle cx="350" cy="450" r="3"/><circle cx="680" cy="400" r="3"/>
    <circle cx="820" cy="760" r="3"/><circle cx="190" cy="610" r="2.5"/>
  </g>

  <!-- city skyline silhouette -->
  <path fill="#1b2226" d="M0 860 L0 760 L60 760 L60 700 L120 700 L120 780 L170 780 L170 650 L230 650 L230 740 L280 740 L280 800 L330 800 L330 860 Z M700 860 L700 790 L750 790 L750 690 L800 690 L800 640 L860 640 L860 730 L920 730 L920 680 L970 680 L970 760 L1024 760 L1024 860 Z"/>
  <!-- ground -->
  <path fill="url(#ground)" d="M0 860 Q512 820 1024 860 L1024 1536 L0 1536 Z"/>
  <!-- rim light on ground -->
  <path fill="#ff8a2a" opacity="0.35" d="M0 860 Q512 820 1024 860 L1024 875 Q512 838 0 875 Z" filter="url(#soft)"/>
  <!-- rubble -->
  <g fill="#0a0807">
    <path d="M0 900 L80 880 L140 910 L210 890 L260 930 L0 960 Z"/>
    <path d="M1024 905 L950 885 L880 915 L820 895 L780 935 L1024 970 Z"/>
  </g>

  <!-- hero: walking toward viewer, slightly off-center -->
  <g fill="#07090b">
    <!-- long shadow -->
    <ellipse cx="512" cy="1262" rx="120" ry="16" opacity="0.8"/>
    <!-- head -->
    <ellipse cx="512" cy="852" rx="30" ry="36"/>
    <!-- neck & coat -->
    <path d="M492 880 L532 880 L540 902 L600 920 Q622 930 624 960 L640 1080 L612 1084 L600 990 L594 1100 L612 1180 L600 1180 L572 1110 L556 1260 L528 1260 L516 1130 L508 1130 L494 1260 L466 1260 L452 1110 L424 1180 L412 1180 L430 1100 L424 990 L412 1084 L384 1080 L400 960 Q402 930 424 920 L484 902 Z"/>
    <!-- coat tails flaring -->
    <path d="M430 1100 L400 1190 L452 1150 Z"/>
    <path d="M594 1100 L630 1185 L572 1150 Z"/>
  </g>
  <!-- rim light on hero -->
  <g fill="none" stroke="#ffb35c" stroke-width="3" opacity="0.8">
    <path d="M482 830 Q512 812 542 830"/>
    <path d="M424 921 Q404 932 400 962"/>
    <path d="M600 921 Q620 932 624 962"/>
  </g>

  <!-- bottom calm fade -->
  <rect y="1000" width="1024" height="536" fill="url(#fade)"/>
</svg>
