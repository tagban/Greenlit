<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536">
  <defs>
    <linearGradient id="wallL" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#05070a"/>
      <stop offset="1" stop-color="#141c22"/>
    </linearGradient>
    <linearGradient id="wallR" x1="1" y1="0" x2="0" y2="0">
      <stop offset="0" stop-color="#030406"/>
      <stop offset="1" stop-color="#11181e"/>
    </linearGradient>
    <linearGradient id="ceil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#020304"/>
      <stop offset="1" stop-color="#0d1317"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151d22"/>
      <stop offset="1" stop-color="#020203"/>
    </linearGradient>
    <linearGradient id="spill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe8ff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#6fb6d8" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9fd8f0" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#3a7c9c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#010102" stop-opacity="0"/>
      <stop offset="1" stop-color="#010102" stop-opacity="0.97"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="1024" height="1536" fill="#030405"/>
  <!-- perspective hallway: vanishing point ~ (512, 640) -->
  <path d="M0 0 L1024 0 L640 520 L384 520 Z" fill="url(#ceil)"/>
  <path d="M0 0 L384 520 L384 820 L0 1536 Z" fill="url(#wallL)"/>
  <path d="M1024 0 L640 520 L640 820 L1024 1536 Z" fill="url(#wallR)"/>
  <path d="M384 820 L640 820 L1024 1536 L0 1536 Z" fill="url(#floor)"/>
  <!-- end wall -->
  <rect x="384" y="520" width="256" height="300" fill="#0a0e11"/>

  <!-- wainscot lines -->
  <g stroke="#1c252b" stroke-width="3" fill="none">
    <path d="M0 1000 L384 700"/><path d="M1024 1000 L640 700"/>
  </g>
  <!-- floorboards -->
  <g stroke="#0b1013" stroke-width="2">
    <path d="M448 820 L256 1536"/><path d="M512 820 L512 1536"/><path d="M576 820 L768 1536"/>
  </g>

  <!-- side doors (closed, dark) on left wall -->
  <path d="M120 360 L250 520 L250 960 L120 1160 Z" fill="#06080a" stroke="#1a2228" stroke-width="3"/>
  <path d="M800 470 L880 400 L880 1080 L800 980 Z" fill="#050608" stroke="#161d22" stroke-width="3"/>

  <!-- the ajar door at end of hall (right side of end wall) -->
  <!-- door frame opening -->
  <rect x="470" y="580" width="110" height="240" fill="#d8f2ff"/>
  <!-- light inside room -->
  <rect x="470" y="580" width="110" height="240" fill="#8fd0ee" opacity="0.5"/>
  <!-- door leaf swung inward, nearly closed, leaving a gap -->
  <path d="M470 580 L540 592 L540 812 L470 820 Z" fill="#0b1115"/>
  <!-- glow around door -->
  <ellipse cx="530" cy="700" rx="180" ry="220" fill="url(#glow)" filter="url(#blur)"/>
  <!-- light spilling on floor -->
  <path d="M540 820 L580 820 L760 1300 L470 1300 Z" fill="url(#spill)" opacity="0.6"/>
  <path d="M548 820 L572 820 L660 1100 L520 1100 Z" fill="#dff4ff" opacity="0.25" filter="url(#blur)"/>

  <!-- faint shadow figure inside the doorway -->
  <path d="M556 640 Q566 630 574 640 Q578 660 572 672 L580 820 L548 820 L556 672 Q550 660 556 640 Z" fill="#0d1a22" opacity="0.85"/>

  <!-- hanging bare bulb (off) -->
  <path d="M512 0 L512 300" stroke="#0e1418" stroke-width="3"/>
  <ellipse cx="512" cy="316" rx="16" ry="20" fill="#121a1f"/>

  <!-- vignette -->
  <rect width="1024" height="1536" fill="#000" opacity="0.15"/>
  <rect y="1000" width="1024" height="536" fill="url(#fade)"/>
</svg>
